services:
  # WebSocket中継サーバー
  server:
    image: node:20
    working_dir: /app
    volumes:
      - ./patipuro-server:/app
    command: sh -c "npm install && node server.js"
    ports:
      - "8080:8080"

  # パチンコ画面 (React)
  web:
    build: ./patipuro-web
    ports:
      - "5173:5173"
    volumes:
      - ./patipuro-web:/app
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - server

  # 拡張機能開発環境
  extension:
    image: node:20
    volumes:
      - ./patipuro-extension:/workspace
    working_dir: /workspace
    tty: true