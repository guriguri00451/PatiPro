services:
  # パチンコ画面 (React)
  web:
    build: ./patipuro-web
    ports:
      - "5173:5173"
    volumes:
      - ./patipuro-web:/app
    environment:
      - CHOKIDAR_USEPOLLING=true

  # 拡張機能開発環境
  extension:
    image: node:20
    volumes:
      - ./patipuro-extension:/workspace
    working_dir: /workspace
    tty: true